# Install: sudo cp /opt/guides-writer/ops/logrotate.conf /etc/logrotate.d/guides-writer
# Test:    sudo logrotate --debug /etc/logrotate.d/guides-writer
/opt/guides-writer/logs/cron.log
/opt/guides-writer/logs/app.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0644 ubuntu ubuntu
    sharedscripts
}
